# 🌸 Arch Linux: Fluttershy Edition - Kitty Configuration
# Calming pastel pink (#FFB6C1), Buttercup cream (#FFF9E6) & Soft Aqua Teal (#80CED6)

font_family      JetBrains Mono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

window_padding_width 14
remember_window_size  yes
initial_window_width  920
initial_window_height 580
hide_window_decorations no
confirm_os_window_close 0

cursor                #FFB6C1
cursor_text_color     #1E1A24
cursor_shape          beam
cursor_blink_interval 0.5

selection_foreground  #1E1A24
selection_background  #FFCCD5

tab_bar_edge          top
tab_bar_style         powerline
tab_powerline_style   slanted
active_tab_foreground   #1E1A24
active_tab_background   #FFB6C1
inactive_tab_foreground #B4AAB9
inactive_tab_background #282230

background            #1E1A24
foreground            #FDFBF7

color0                #2E2A36
color8                #4A4255
color1                #F4ACB7
color9                #FFCCD5
color2                #B5E2FA
color10               #C5ECEF
color3                #FFF9E6
color11               #FEF6D8
color4                #80CED6
color12               #9BE3EB
color5                #FFB6C1
color13               #FFC8D2
color6                #A0E7E5
color14               #B8F2F0
color7                #EADEDA
color15               #FFFFFF
