name: Build Arch Linux Fluttershy ISO

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Live ISO Image
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Free disk space on runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo docker image prune -a -f || true

      - name: Build ISO inside official Arch Linux Docker container
        run: |
          mkdir -p out
          docker run --rm --privileged \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            archlinux:latest bash -c "
              set -e
              echo '==> Updating system & installing archiso...'
              pacman -Syu --noconfirm archlinux-keyring
              pacman -S --noconfirm archiso git
              echo '==> Building ISO via mkarchiso...'
              mkarchiso -v -w /tmp/archiso-tmp -o /workspace/out /workspace/archiso < /dev/null
              echo '==> Generating SHA256 checksums...'
              cd /workspace/out && sha256sum archlinux-fluttershy-*.iso > sha256.txt
              ls -la /workspace/out
          "

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: archlinux-fluttershy-x86_64-iso
          path: out/archlinux-fluttershy-*.iso
          retention-days: 14

      - name: Upload SHA256 Checksum Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sha256-checksum
          path: out/sha256.txt

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2026.10.21
          name: "🌸 Arch Linux: Fluttershy Edition v2026.10.21"
          files: |
            out/archlinux-fluttershy-*.iso
            out/sha256.txt
          body: |
            # 🌸 Arch Linux: Fluttershy Edition (Release v2026.10.21)

            > *"Umm... if it's not too much trouble, welcome to my Arch Linux terminal! ...yay! ✿"*

            ### ✨ Что внутри / What's Included:
            - **Два режима**: Портативный Live Workspace (работает напрямую из RAM, 0 ГБ диска) и 1-click автоматический установщик на диск (`install-arch`).
            - **Переключение тем**: Светлая пастельно-розовая (`theme light`) и тёмная обсидиановая (`theme dark`).
            - **Каноничный Braille арт Fluttershy**: из emojicombos вшит в `fastfetch` и главное меню `menu`.
            - **Полная поддержка шрифтов**: `noto-fonts`, `ttf-dejavu`, `noto-fonts-emoji` вшиты в систему.
            - **Совместимость**: Готов к записи на флешку через Rufus (ПК) и запуску в UTM (Mac).

            ### 📦 Контрольные суммы / Checksums:
            Проверьте образ перед записью:
            ```bash
            sha256sum -c sha256.txt
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
